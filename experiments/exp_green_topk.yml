x-exp-env: &exp-env
  # FIX: era LB_STRATEGY: "green_lc" (copiato per errore da exp_green_lc.yml)
  # con LB_TOP_K: "30" — ma main.go legge LB_TOP_K_PERCENT, non LB_TOP_K, e
  # PolicyFactory usa il valore come FRAZIONE (0.30), non percentuale (30).
  # Con questi tre errori insieme, l'esperimento eseguiva davvero GreenLC con
  # alpha non impostato (default 0), non GreenTopK — un'altra policy diversa
  # da quella nominale, invisibile finche' non si controlla il codice.
  LB_STRATEGY: "green_top_k"
  LB_TOP_K_PERCENT: "0.30"

services:
  lb-node-1: { environment: *exp-env }
  lb-node-2: { environment: *exp-env }
  lb-node-3: { environment: *exp-env }
  lb-node-4: { environment: *exp-env }
  lb-node-5: { environment: *exp-env }

  loadgen:
    environment:
      - LOADGEN_OUTPUT=${LOADGEN_OUTPUT:-/app/output/results_green_topk_k30.csv}

