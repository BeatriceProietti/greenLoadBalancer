x-exp-env: &exp-env
  LB_STRATEGY: "least_connections"

services:
  lb-node-1: { environment: *exp-env }
  lb-node-2: { environment: *exp-env }
  lb-node-3: { environment: *exp-env }
  lb-node-4: { environment: *exp-env }
  lb-node-5: { environment: *exp-env }

  loadgen:
    environment:
      - LOADGEN_OUTPUT=${LOADGEN_OUTPUT:-/app/output/results_least_connections.csv}
      - LOADGEN_REQUESTS=${LOADGEN_REQUESTS:-1000}
      - LOADGEN_CONCURRENCY=${LOADGEN_CONCURRENCY:-18}
      - LOADGEN_DIFFICULTY_MIN=${LOADGEN_DIFFICULTY_MIN:-20000}
      - LOADGEN_DIFFICULTY_MAX=${LOADGEN_DIFFICULTY_MAX:-500000}
