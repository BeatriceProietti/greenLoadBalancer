x-exp-env: &exp-env
  # FIX: era "least_connection" (singolare). Il switch in policy.go confronta
  # con "least_connections" (plurale) — con lo spelling sbagliato la stringa
  # non corrispondeva a nessun case e PolicyFactory ricadeva silenziosamente
  # sul default (RoundRobin): questo esperimento stava eseguendo Round Robin
  # travestito da Least Connections, non la vera policy da confrontare.
  LB_STRATEGY: "least_connections"

services:
  lb-node-1: { environment: *exp-env }
  lb-node-2: { environment: *exp-env }
  lb-node-3: { environment: *exp-env }
  lb-node-4: { environment: *exp-env }
  lb-node-5: { environment: *exp-env }

  loadgen:
    environment:
      - LOADGEN_OUTPUT=${LOADGEN_OUTPUT:-/app/output/results_least_connections.csv}

